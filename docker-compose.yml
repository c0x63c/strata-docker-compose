services:
  strata:
    build:
      context: ./Strata
      dockerfile: ./Dockerfile
      args:
        - STRATA_COMMIT=${STRATA_COMMIT:-146df3c468739147f520ac3816de806f71232571}
        #- CUDA_ARCHITECTURES=89 #RTX 40 only
    container_name: strata01
    ulimits:
      memlock: -1
    environment:
      PORT: 11435
      #MODEL: 'Q2_0'
      MODEL: 'IQ2_XS'
      #MODEL: 'IQ3_XXS'
      #MODEL: 'IQ3_S'
      #MODEL: 'Coder'
      CONTEXT: ${CONTEXT:-32k}
      PARALLEL: ${PARALLEL:-} 
      VISION: ${VISION:-off} 
      API_KEY: ${API_KEY:-}
    ports:
      - '11435:11435/tcp'
    volumes:
      - ./volumes/strata/data:/data
    logging:
      options:
        max-size: '200k'
        max-file: '10'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
